<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loader</title>
    <style>
    body{
        background-color: #0d1f3c;
    }
    div{position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        height: 100px;
        width: 100px;
        border-radius: 50%;
        background-color: transparent;
        border-left: 5px solid orange;
        animation: loader 1s steps(100) 0s infinite normal;      
        }
    
     @keyframes loader {
        from{transform: rotate(0deg);
        }
        to{
            transform: rotate(360deg);
        }
    }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
