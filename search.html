<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search - Manzil Bharat</title>
    <link rel="icon" type="image/png" href="icon.png">
    <meta name="description" content="Search destinations, hotels, flights, and travel guides with Manzil Bharat AI.">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { font-size: 16px; scroll-behavior: smooth; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; overflow-x: hidden; background: #f5f7fa; min-height: 100vh; display: flex; flex-direction: column; }

        nav { position: fixed; top: 0; left: 0; right: 0; background: rgba(10, 22, 40, 0.95); backdrop-filter: blur(10px); padding: 1rem 5%; display: flex; align-items: center; justify-content: space-between; z-index: 1000; }
        .logo { font-family: 'Pacifico', cursive; font-size: 1.5rem; color: #FF6B35; text-decoration: none; }
        .nav-links { display: flex; list-style: none; gap: 2rem; }
        .nav-links a { text-decoration: none; color: white; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover { color: #FF6B35; }
        .menu-toggle { display: none; background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }

        .search-header { background: linear-gradient(135deg, rgba(26, 35, 126, 0.85), rgba(255, 107, 53, 0.7)); padding: 7rem 5% 3rem; text-align: center; color: white; }
        .search-header h1 { font-size: clamp(1.5rem, 4vw, 2.5rem); margin-bottom: 1.5rem; }

        .search-box { max-width: 700px; margin: 0 auto; display: flex; gap: 0.5rem; }
        .search-box input { flex: 1; padding: 1rem 1.5rem; border: none; border-radius: 25px; font-size: 1rem; outline: none; }
        .search-box button { background: linear-gradient(135deg, #FF6B35, #E65100); color: white; border: none; border-radius: 25px; padding: 1rem 2rem; font-size: 1rem; font-weight: 600; cursor: pointer; transition: transform 0.3s; display: flex; align-items: center; gap: 0.5rem; }
        .search-box button:hover { transform: translateY(-2px); }
        .search-box button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .results-section { max-width: 800px; margin: 0 auto; padding: 3rem 5%; flex: 1; }

        .loading { text-align: center; padding: 3rem; color: #666; }
        .loading i { font-size: 2rem; color: #FF6B35; margin-bottom: 1rem; animation: spin 1s linear infinite; display: block; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        .result-card { background: white; border-radius: 16px; padding: 2rem; box-shadow: 0 4px 20px rgba(0,0,0,0.06); margin-bottom: 1.5rem; }
        .result-card h3 { font-size: 1.2rem; color: #0a1628; margin-bottom: 0.8rem; }
        .result-card p { color: #555; line-height: 1.8; white-space: pre-wrap; }

        .error-msg { background: #fff3f3; border: 1px solid #ffcdd2; border-radius: 12px; padding: 1.5rem; color: #c62828; text-align: center; }

        .empty-state { text-align: center; padding: 4rem 2rem; color: #888; }
        .empty-state i { font-size: 3rem; color: #ccc; margin-bottom: 1rem; }
        .empty-state p { font-size: 1.1rem; }

        footer { background: linear-gradient(180deg, #0a1628 0%, #0d1f3c 100%); color: white; padding: 3rem 5% 1.5rem; text-align: center; margin-top: auto; }
        footer .footer-logo { font-family: 'Pacifico', cursive; font-size: 1.8rem; color: #FF6B35; text-decoration: none; display: inline-block; margin-bottom: 1rem; }
        footer p { color: #8892b0; margin-bottom: 1.5rem; }
        footer .footer-bottom { border-top: 1px solid rgba(255, 255, 255, 0.05); padding-top: 1.5rem; color: #5a6a8a; font-size: 0.9rem; }

        @media (max-width: 768px) {
            .nav-links { display: none; position: absolute; top: 100%; left: 0; right: 0; background: rgba(10, 22, 40, 0.98); flex-direction: column; padding: 1rem 5%; gap: 1rem; }
            .nav-links.active { display: flex; }
            .menu-toggle { display: block; }
            .search-box { flex-direction: column; }
            .search-box button { width: 100%; justify-content: center; }
        }
        @media (max-width: 480px) {
            .search-header { padding: 6rem 5% 2rem; }
            .results-section { padding: 2rem 5%; }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Manzil Bharat</a>
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <section class="search-header">
        <h1>Search with AI</h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Where do you want to go?" aria-label="Search destination">
            <button type="button" id="searchBtn" onclick="doSearch()"><i class="fas fa-search"></i> Search</button>
        </div>
    </section>

    <section class="results-section" id="results">
        <div class="empty-state">
            <i class="fas fa-compass"></i>
            <p>Ask anything about travel in India — destinations, hotels, food, routes, weather, and more.</p>
        </div>
    </section>

    <footer>
        <a href="index.html" class="footer-logo">Manzil Bharat</a>
        <p>Explore the world with Bhartiya dil.</p>
        <div class="footer-bottom">&copy; 2026 Manzil Bharat. All rights reserved.</div>
    </footer>

    <script>
        const NIM_API_KEY = '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';
        const NIM_ENDPOINT = 'https://integrate.api.nvidia.com/v1/chat/completions';
        const NIM_MODEL = 'meta/llama-3.1-8b-instruct';

        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const resultsDiv = document.getElementById('results');

        const urlQuery = new URLSearchParams(window.location.search).get('q');
        if (urlQuery) {
            searchInput.value = urlQuery;
            doSearch();
        }

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') doSearch();
        });

        async function doSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            searchBtn.disabled = true;
            resultsDiv.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i><p>Searching for "' + query + '"...</p></div>';

            const systemPrompt = 'You are Manzil Bharat AI, an Indian travel assistant. Help users with travel queries about India — destinations, hotels, food, transport, weather, culture, safety tips, budgets, and itineraries. Be helpful, concise, and enthusiastic about Indian travel. Use markdown formatting for readability.';

            try {
                const res = await fetch(NIM_ENDPOINT, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + NIM_API_KEY
                    },
                    body: JSON.stringify({
                        model: NIM_MODEL,
                        messages: [
                            { role: 'system', content: systemPrompt },
                            { role: 'user', content: query }
                        ],
                        temperature: 0.7,
                        max_tokens: 1024
                    })
                });

                if (!res.ok) throw new Error('API error: ' + res.status);

                const data = await res.json();
                const answer = data.choices[0].message.content;

                resultsDiv.innerHTML = '<div class="result-card"><h3><i class="fas fa-robot" style="color:#FF6B35;"></i> AI Travel Assistant</h3><p>' + formatAnswer(answer) + '</p></div>';

            } catch (err) {
                resultsDiv.innerHTML = '<div class="error-msg"><i class="fas fa-exclamation-triangle"></i> Something went wrong. Please try again later.</div>';
                console.error(err);
            } finally {
                searchBtn.disabled = false;
            }
        }

        function formatAnswer(text) {
            return text
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/`(.*?)`/g, '<code style="background:#f0f0f0;padding:0.2rem 0.4rem;border-radius:4px;">$1</code>')
                .replace(/^### (.*$)/gm, '<h4 style="margin:1rem 0 0.5rem;color:#0a1628;">$1</h4>')
                .replace(/^## (.*$)/gm, '<h3 style="margin:1rem 0 0.5rem;color:#0a1628;">$1</h3>')
                .replace(/^# (.*$)/gm, '<h2 style="margin:1rem 0 0.5rem;color:#0a1628;">$1</h2>')
                .replace(/^- (.*$)/gm, '<li style="margin-left:1.5rem;">$1</li>')
                .replace(/\n/g, '<br>');
        }

        const menuToggle = document.getElementById('menuToggle');
        const navLinks = document.getElementById('navLinks');
        menuToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            navLinks.classList.toggle('active');
            const icon = this.querySelector('i');
            icon.classList.toggle('fa-bars');
            icon.classList.toggle('fa-times');
        });
        document.addEventListener('click', function(e) {
            if (!navLinks.contains(e.target) && !menuToggle.contains(e.target)) {
                navLinks.classList.remove('active');
                menuToggle.querySelector('i').classList.add('fa-bars');
                menuToggle.querySelector('i').classList.remove('fa-times');
            }
        });
    </script>
</body>
</html>
