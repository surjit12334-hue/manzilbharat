    <meta name="twitter:card" content="summary_large_image" />

      content="Travel stories, guides, and updates from Manzil Bharat."
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        font-size: 16px;
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        color: #333;
        overflow-x: hidden;
        background: #f5f7fa;
      }

      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: rgba(10, 22, 40, 0.95);
        backdrop-filter: blur(10px);
        padding: 1rem 5%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 1000;
      }
      .logo {
        font-family: 'Pacifico', cursive;
        font-size: 1.5rem;
        color: #ff6b35;
        text-decoration: none;
      }
      .nav-links {
        display: flex;
        list-style: none;
        gap: 2rem;
      }
      .nav-links a {
        text-decoration: none;
        color: white;
        font-weight: 500;
        transition: color 0.3s;
      }
      .nav-links a:hover {
        color: #ff6b35;
      }
      .menu-toggle {
        display: none;
        background: none;
        border: none;
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
      }

      .page-hero {
        background: linear-gradient(135deg, rgba(26, 35, 126, 0.85), rgba(255, 107, 53, 0.7));
        padding: 8rem 5% 4rem;
        text-align: center;
        color: white;
      }
      .page-hero h1 {
        font-size: clamp(2rem, 5vw, 3rem);
        margin-bottom: 1rem;
      }
      .page-hero p {
        font-size: clamp(1rem, 2vw, 1.2rem);
        opacity: 0.9;
        max-width: 600px;
        margin: 0 auto;
      }

      .blog-section {
        max-width: 1100px;
        margin: 0 auto;
        padding: 4rem 5%;
      }
      .blog-section h2 {
        font-size: 1.4rem;
        color: #0a1628;
        margin-bottom: 1.8rem;
      }
      .blog-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 1.5rem;
      }
      .blog-card {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        transition:
          transform 0.3s,
          box-shadow 0.3s;
        display: flex;
        flex-direction: column;
      }
      .blog-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 40px rgba(26, 35, 126, 0.12);
      }
      .blog-card a {
        color: inherit;
        text-decoration: none;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .blog-thumb {
        position: relative;
        width: 100%;
        padding-top: 56.25%;
        background: #eef1f8;
      }
      .blog-thumb img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .blog-info {
        padding: 1.2rem 1.3rem 1.4rem;
        display: flex;
        flex-direction: column;
        gap: 0.7rem;
      }
      .blog-info h3 {
        color: #0a1628;
        font-size: 1.1rem;
        line-height: 1.4;
      }
      .blog-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 0.9rem;
        color: #7a8599;
        font-size: 0.9rem;
      }
      .blog-meta span {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .blog-info p {
        color: #4a5568;
        font-size: 0.95rem;
      }
      .loading {
        text-align: center;
        color: #7a8599;
        padding: 2rem;
        grid-column: 1 / -1;
      }
      .loading i {
        font-size: 1.6rem;
        margin-bottom: 0.6rem;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      .error-msg {
        text-align: center;
        color: #d64545;
        padding: 2rem;
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.6rem;
      }

      footer {
        background: #0a1628;
        color: white;
        text-align: center;
        padding: 3rem 5% 2rem;
      }
      .footer-logo {
        font-family: 'Pacifico', cursive;
        font-size: 1.8rem;
        color: #ff6b35;
        text-decoration: none;
        display: inline-block;
        margin-bottom: 0.8rem;
      }
      footer p {
        opacity: 0.8;
        margin-bottom: 1.5rem;
      }
      .footer-bottom {
        padding-top: 1.5rem;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        opacity: 0.7;
        font-size: 0.9rem;
      }

      @media (max-width: 768px) {
        .menu-toggle {
          display: block;
        }
        .nav-links {
          position: absolute;
          top: 100%;
          left: 0;
          right: 0;
          flex-direction: column;
          background: rgba(10, 22, 40, 0.98);
          padding: 1rem 5%;
          gap: 1rem;
          display: none;
        }
        .nav-links.active {
          display: flex;
        }
        .blog-section {
          padding: 2rem 5%;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html" class="logo">Manzil Bharat</a>
      <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="trip.html">Plan Trip</a></li>
        <li><a href="mytrips.html">My Trips</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li data-mb-show="guest"><a href="login.html">Login</a></li>
        <li data-mb-show="user" hidden>
          <a href="mytrips.html"
            ><i class="fas fa-user-circle"></i> Hi, <span data-mb-name>traveller</span></a
          >
        </li>
        <li data-mb-show="user" hidden><a href="#" data-mb-logout>Logout</a></li>
      </ul>
    </nav>

    <section class="page-hero">
      <h1>Blog</h1>
      <p>Travel stories, guides, and updates from Manzil Bharat.</p>
    </section>

    <section class="blog-section">
      <h2>Travel Stories</h2>
      <div id="blogGrid" class="blog-grid">
        <div class="loading">
          <i class="fas fa-spinner"></i>
          <p>Loading stories...</p>
        </div>
      </div>
    </section>

    <footer>
      <a href="index.html" class="footer-logo">Manzil Bharat</a>
      <p>Explore the world with Bhartiya dil.</p>
      <div class="footer-bottom">&copy; 2026 Manzil Bharat. All rights reserved.</div>
    </footer>

    <script>
      const blogGrid = document.getElementById('blogGrid');

      fetch('data/blog_posts.json')
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function (posts) {
          if (!Array.isArray(posts) || posts.length === 0) {
            blogGrid.innerHTML =
              '<div class="error-msg"><i class="fas fa-exclamation-triangle"></i> No stories found. Check back later.</div>';
            return;
          }

          var html = '';
          posts.forEach(function (post) {
            var date = post.date
              ? new Date(post.date + 'T00:00:00').toLocaleDateString('en-IN', {
                  day: 'numeric',
                  month: 'short',
                  year: 'numeric',
                })
              : '';
            var excerpt = stripHtml(post.excerpt || '').substring(0, 160);
            var href = post.slug ? 'blog-post.html?slug=' + encodeURIComponent(post.slug) : '#';
            html +=
              '<div class="blog-card">' +
              '<a href="' +
              escAttr(href) +
              '">' +
              '<div class="blog-thumb">' +
              (post.image
                ? '<img src="' +
                  escAttr(post.image) +
                  '" alt="' +
                  escHtml(post.title) +
                  '" loading="lazy">'
                : '') +
              '</div>' +
              '<div class="blog-info">' +
              '<h3>' +
              escHtml(post.title) +
              '</h3>' +
              '<div class="blog-meta">' +
              (date ? '<span><i class="fas fa-calendar"></i> ' + escHtml(date) + '</span>' : '') +
              (post.author
                ? '<span><i class="fas fa-user"></i> ' + escHtml(post.author) + '</span>'
                : '') +
              '</div>' +
              (excerpt
                ? '<p>' + escHtml(excerpt) + (excerpt.length >= 160 ? '...' : '') + '</p>'
                : '') +
              '</div>' +
              '</a>' +
              '</div>';
          });

          blogGrid.innerHTML = html;
        })
        .catch(function (err) {
          blogGrid.innerHTML =
            '<div class="error-msg"><i class="fas fa-exclamation-triangle"></i> Failed to load stories. Please try again later.</div>';
          console.error(err);
        });

      function stripHtml(html) {
        var tmp = document.createElement('div');
        tmp.innerHTML = html;
        return tmp.textContent || tmp.innerText || '';
      }

      function escHtml(str) {
        if (str == null) return '';
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(String(str)));
        return div.innerHTML;
      }

      function escAttr(str) {
        if (str == null) return '';
        return escHtml(String(str))
          .replace(/`/g, '&#96;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      var menuToggle = document.getElementById('menuToggle');
      var navLinks = document.getElementById('navLinks');
      menuToggle.addEventListener('click', function (e) {
        e.stopPropagation();
        navLinks.classList.toggle('active');
        var icon = this.querySelector('i');
        icon.classList.toggle('fa-bars');
        icon.classList.toggle('fa-times');
      });
      document.addEventListener('click', function (e) {
        if (!navLinks.contains(e.target) && !menuToggle.contains(e.target)) {
          navLinks.classList.remove('active');
          menuToggle.querySelector('i').classList.add('fa-bars');
          menuToggle.querySelector('i').classList.remove('fa-times');
        }
      });
    </script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="nav-auth.js"></script>
  </body>
</html>
