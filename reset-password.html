<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Manzil Bharat</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, rgba(26,35,126,0.85), rgba(255,107,53,0.7)), url('homebackground.png') center/cover no-repeat; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
        .card { background: white; border-radius: 20px; padding: 2.5rem; width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .card h1 { font-size: 1.5rem; color: #0a1628; margin-bottom: 0.3rem; text-align: center; }
        .card .subtitle { color: #888; font-size: 0.9rem; text-align: center; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-weight: 600; color: #333; margin-bottom: 0.4rem; font-size: 0.9rem; }
        .form-group input { width: 100%; padding: 0.8rem 1rem; border: 2px solid #e0e5ec; border-radius: 12px; font-size: 1rem; outline: none; transition: all 0.3s; }
        .form-group input:focus { border-color: #FF6B35; box-shadow: 0 0 0 3px rgba(255,107,53,0.1); }
        .btn-primary { width: 100%; padding: 0.9rem; background: linear-gradient(135deg, #FF6B35, #E65100); color: white; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        .msg { text-align: center; font-size: 0.85rem; margin-top: 0.8rem; display: none; }
        .back { display: block; text-align: center; margin-top: 1.2rem; color: #FF6B35; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    </style>
<script src="config.js"></script>
</head>
<body>
    <div class="card">
        <a href="index.html" style="display:block;text-align:center;font-family:'Pacifico',cursive;font-size:1.8rem;color:#FF6B35;text-decoration:none;margin-bottom:1rem;">Manzil Bharat</a>
        <h1>Set a New Password</h1>
        <p class="subtitle">Enter a new password for your account.</p>
        <div class="form-group">
            <label for="password">New Password</label>
            <input type="password" id="password" placeholder="Min 8 chars, uppercase, number & symbol" minlength="8" required>
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Re-enter your password" required>
        </div>
        <button class="btn-primary" id="submitBtn" onclick="submitReset()"><i class="fas fa-key"></i> Reset Password</button>
        <p class="msg" id="message"></p>
        <a href="login.html" class="back">Back to Login</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const msg = document.getElementById('message');

        function showMsg(text, color) {
            msg.textContent = text;
            msg.style.color = color;
            msg.style.display = 'block';
        }

        function validatePassword(pw) {
            if (pw.length < 8) return 'Password must be at least 8 characters';
            if (!/[A-Z]/.test(pw)) return 'Password must contain at least one uppercase letter';
            if (!/[0-9]/.test(pw)) return 'Password must contain at least one number';
            if (!/[^A-Za-z0-9]/.test(pw)) return 'Password must contain at least one special character';
            return null;
        }

        async function submitReset() {
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (!token) { showMsg('Invalid or missing reset link.', '#e74c3c'); return; }
            if (password !== confirm) { showMsg('Passwords do not match.', '#e74c3c'); return; }

            const err = validatePassword(password);
            if (err) { showMsg(err, '#e74c3c'); return; }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Resetting...';

            try {
                const res = await fetch(API_BASE + '/api/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, new_password: password })
                });
                const result = await res.json();
                if (res.ok) {
                    showMsg(result.message || 'Password updated! Redirecting to login...', '#27ae60');
                    setTimeout(() => { window.location.href = 'login.html'; }, 2000);
                } else {
                    showMsg(result.error || 'Failed to reset password.', '#e74c3c');
                }
            } catch (err) {
                showMsg('Server error. Please try again later.', '#e74c3c');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-key"></i> Reset Password';
            }
        }
    </script>
</body>
</html>
