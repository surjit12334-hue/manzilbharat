<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blog Post - Manzil Bharat</title>
    <link rel="icon" type="image/png" href="icon.png" />
    <meta name="description" content="Travel story from Manzil Bharat." />
    <link rel="canonical" href="https://manzilbharat.onrender.com/blog-post.html" />
    <meta property="og:site_name" content="Manzil Bharat" />
    <meta property="og:type" content="article" />
    <meta property="og:title" content="Blog Post - Manzil Bharat" />
    <meta property="og:description" content="Travel story from Manzil Bharat." />
    <meta property="og:url" content="https://manzilbharat.onrender.com/blog-post.html" />
    <meta property="og:image" content="https://manzilbharat.onrender.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blog Post - Manzil Bharat" />
    <meta name="twitter:description" content="Travel story from Manzil Bharat." />
    <meta name="twitter:image" content="https://manzilbharat.onrender.com/og-image.jpg" />
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        font-size: 16px;
      }
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.7;
        color: #333;
        background: #f5f7fa;
      }

      nav {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: rgba(10, 22, 40, 0.95);
        backdrop-filter: blur(10px);
        padding: 1rem 5%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 1000;
      }
      .logo {
        font-family: 'Pacifico', cursive;
        font-size: 1.5rem;
        color: #ff6b35;
        text-decoration: none;
      }
      .nav-links {
        display: flex;
        list-style: none;
        gap: 2rem;
      }
      .nav-links a {
        text-decoration: none;
        color: white;
        font-weight: 500;
        transition: color 0.3s;
      }
      .nav-links a:hover {
        color: #ff6b35;
      }
      .menu-toggle {
        display: none;
        background: none;
        border: none;
        color: white;
        font-size: 1.5rem;
        cursor: pointer;
      }

      .post-hero {
        position: relative;
        padding: 9rem 5% 4rem;
        color: white;
        text-align: center;
        background-size: cover;
        background-position: center;
      }
      .post-hero::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(10, 22, 40, 0.6), rgba(10, 22, 40, 0.9));
      }
      .post-hero-content {
        position: relative;
        max-width: 900px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .post-hero h1 {
        font-size: clamp(2rem, 5vw, 3.2rem);
        line-height: 1.2;
      }
      .post-meta {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 1.2rem;
        opacity: 0.9;
      }
      .post-meta span {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .post-body {
        max-width: 820px;
        margin: -2rem auto 0;
        background: white;
        border-radius: 16px;
        box-shadow: 0 30px 60px rgba(10, 22, 40, 0.08);
        padding: clamp(2rem, 6vw, 4rem);
        position: relative;
        z-index: 2;
      }
      .post-body h2 {
        color: #0a1628;
        margin: 2rem 0 1rem;
      }
      .post-body p {
        margin-bottom: 1.2rem;
        color: #3f4a5c;
      }
      .post-body ul {
        margin: 0 0 1.6rem 1.6rem;
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        color: #3f4a5c;
      }
      .post-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.7rem;
        margin-top: 2.4rem;
      }
      .post-tags span {
        background: rgba(255, 107, 53, 0.12);
        color: #e65100;
        padding: 0.4rem 0.9rem;
        border-radius: 999px;
        font-size: 0.9rem;
      }
      .post-back {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        margin-top: 2rem;
        color: #1a237e;
        text-decoration: none;
        font-weight: 600;
      }
      .post-back:hover {
        color: #ff6b35;
      }
      .post-status {
        max-width: 820px;
        margin: 2rem auto;
        text-align: center;
        color: #7a8599;
      }

      footer {
        background: #0a1628;
        color: white;
        text-align: center;
        padding: 3rem 5% 2rem;
        margin-top: 4rem;
      }
      .footer-logo {
        font-family: 'Pacifico', cursive;
        font-size: 1.8rem;
        color: #ff6b35;
        text-decoration: none;
        display: inline-block;
        margin-bottom: 0.8rem;
      }
      footer p {
        opacity: 0.8;
        margin-bottom: 1.5rem;
      }
      .footer-bottom {
        padding-top: 1.5rem;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        opacity: 0.7;
        font-size: 0.9rem;
      }

      @media (max-width: 768px) {
        .menu-toggle {
          display: block;
        }
        .nav-links {
          position: absolute;
          top: 100%;
          left: 0;
          right: 0;
          flex-direction: column;
          background: rgba(10, 22, 40, 0.98);
          padding: 1rem 5%;
          gap: 1rem;
          display: none;
        }
        .nav-links.active {
          display: flex;
        }
        .post-body {
          margin: -1rem 5% 0;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html" class="logo">Manzil Bharat</a>
      <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="trip.html">Plan Trip</a></li>
        <li><a href="mytrips.html">My Trips</a></li>
        <li><a href="blog.html">Blog</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li data-mb-show="guest"><a href="login.html">Login</a></li>
        <li data-mb-show="user" hidden>
          <a href="mytrips.html"
            ><i class="fas fa-user-circle"></i> Hi, <span data-mb-name>traveller</span></a
          >
        </li>
        <li data-mb-show="user" hidden><a href="#" data-mb-logout>Logout</a></li>
      </ul>
    </nav>

    <header class="post-hero" id="postHero">
      <div class="post-hero-content">
        <h1 id="postTitle">Loading story...</h1>
        <div class="post-meta" id="postMeta"></div>
      </div>
    </header>

    <article class="post-body" id="postBody" hidden></article>
    <div class="post-status" id="postStatus">Loading story...</div>

    <footer>
      <a href="index.html" class="footer-logo">Manzil Bharat</a>
      <p>Explore the world with Bhartiya dil.</p>
      <div class="footer-bottom">&copy; 2026 Manzil Bharat. All rights reserved.</div>
    </footer>

    <script>
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug');
      const postHero = document.getElementById('postHero');
      const postTitle = document.getElementById('postTitle');
      const postMeta = document.getElementById('postMeta');
      const postBody = document.getElementById('postBody');
      const postStatus = document.getElementById('postStatus');

      function escHtml(str) {
        if (str == null) return '';
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(String(str)));
        return div.innerHTML;
      }

      function formatDate(value) {
        if (!value) return '';
        return new Date(value + 'T00:00:00').toLocaleDateString('en-IN', {
          day: 'numeric',
          month: 'long',
          year: 'numeric',
        });
      }

      if (!slug) {
        postStatus.textContent = 'No story selected. Head back to the blog to pick a post.';
      } else {
        fetch('data/blog_posts.json')
          .then(function (res) {
            if (!res.ok) throw new Error('HTTP ' + res.status);
            return res.json();
          })
          .then(function (posts) {
            var post = Array.isArray(posts)
              ? posts.find(function (item) {
                  return item.slug === slug || item.id === slug;
                })
              : null;
            if (!post) {
              postStatus.textContent =
                'Story not found. Head back to the blog to see available posts.';
              return;
            }

            document.title = post.title + ' - Manzil Bharat';
            postTitle.textContent = post.title;
            if (post.image) {
              postHero.style.backgroundImage =
                "linear-gradient(180deg, rgba(10,22,40,0.6), rgba(10,22,40,0.9)), url('" +
                post.image.replace(/'/g, "\\'") +
                "')";
            }

            postMeta.replaceChildren();
            if (post.date) {
              var dateSpan = document.createElement('span');
              dateSpan.innerHTML =
                '<i class="fas fa-calendar"></i> ' + escHtml(formatDate(post.date));
              postMeta.appendChild(dateSpan);
            }
            if (post.author) {
              var authorSpan = document.createElement('span');
              authorSpan.innerHTML = '<i class="fas fa-user"></i> ' + escHtml(post.author);
              postMeta.appendChild(authorSpan);
            }

            postBody.innerHTML =
              (post.content || '') +
              '<div class="post-tags">' +
              (Array.isArray(post.tags)
                ? post.tags
                    .map(function (tag) {
                      return '<span>' + escHtml(tag) + '</span>';
                    })
                    .join('')
                : '') +
              '</div>' +
              '<a class="post-back" href="blog.html"><i class="fas fa-arrow-left"></i> Back to all stories</a>';

            postStatus.remove();
            postBody.hidden = false;
          })
          .catch(function (err) {
            console.error(err);
            postStatus.textContent = 'Failed to load the story. Please try again later.';
          });
      }

      var menuToggle = document.getElementById('menuToggle');
      var navLinks = document.getElementById('navLinks');
      menuToggle.addEventListener('click', function (e) {
        e.stopPropagation();
        navLinks.classList.toggle('active');
        var icon = this.querySelector('i');
        icon.classList.toggle('fa-bars');
        icon.classList.toggle('fa-times');
      });
      document.addEventListener('click', function (e) {
        if (!navLinks.contains(e.target) && !menuToggle.contains(e.target)) {
          navLinks.classList.remove('active');
          menuToggle.querySelector('i').classList.add('fa-bars');
          menuToggle.querySelector('i').classList.remove('fa-times');
        }
      });
    </script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="nav-auth.js"></script>
  </body>
</html>
